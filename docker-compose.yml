# Coolify-kompatibles Compose:
#   - `web`     Next.js (Standalone-Build)
#   - `postgres` Datenbank
#   - `minio`   S3-kompatibler Object-Storage
#   - `minio-init` legt einmalig den Public-Bucket an
#
# In Coolify: dieses File als "Docker Compose"-Service deployen.
# Lokal: `docker compose up -d --build` (vorher .env nach Beispiel pflegen).

services:
  web:
    build: .
    image: rallyeclub-klostertal
    container_name: rallyeclub-klostertal-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # MinIO im selben Netz: HTTP, Path-Style.
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      # Public-URL der Bilder — bei Coolify auf eigenen Reverse-Proxy mappen,
      # z. B. https://files.rallyeclub-klostertal.at/<bucket>
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: rallyeclub-klostertal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rallyeclub-klostertal-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    # WICHTIG: keine Host-Port-Mappings.
    # `web` erreicht MinIO intern über `http://minio:9000` (Docker-Netzwerk).
    # Soll MinIO öffentlich erreichbar sein (z. B. für Bilder oder Console),
    # dann in Coolify pro Port einen Domain-Proxy setzen:
    #   - 9000 → files.<deine-domain>          (S3-API, S3_PUBLIC_URL)
    #   - 9001 → s3-admin.<deine-domain>       (Web-Console, optional)
    # Direkt-Mappings auf den Host führen unter Coolify zu Port-Konflikten.
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Einmaliger Init-Container: legt Bucket an und macht ihn öffentlich lesbar.
  minio-init:
    image: minio/mc:latest
    container_name: rallyeclub-klostertal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        (mc mb --ignore-existing local/${S3_BUCKET}) &&
        mc anonymous set download local/${S3_BUCKET} &&
        echo 'Bucket ${S3_BUCKET} bereit.'
      "
    restart: "no"

volumes:
  postgres-data:
  minio-data:
